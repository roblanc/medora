<!doctype html>
<html lang="ro" data-medora-appearance="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <meta name="description" content="Autentificare și înregistrare Medora — Catalog farmaceutic și decizie clinică.">
  <title>Medora — Autentificare</title>
  <script>
    try {
      document.documentElement.dataset.medoraTheme = localStorage.getItem('medora-theme') || 'iridescent';
    } catch(e) {
      document.documentElement.dataset.medoraTheme = 'iridescent';
    }
  </script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <link rel="stylesheet" href="theme.css?v=10">
  <script src="theme.js?v=10" defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&display=swap');
    @font-face {
      font-family: "Mazzard H";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("https://db.onlinewebfonts.com/t/eb5b5ee332420add9a40ee988cb6ac37.woff2") format("woff2"),
           url("https://db.onlinewebfonts.com/t/eb5b5ee332420add9a40ee988cb6ac37.woff") format("woff"),
           url("https://db.onlinewebfonts.com/t/eb5b5ee332420add9a40ee988cb6ac37.ttf") format("truetype");
    }
    @font-face {
      font-family: "Mazzard H";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("https://db.onlinewebfonts.com/t/875fffdfa62169a0f131e90f37f1faf4.woff2") format("woff2"),
           url("https://db.onlinewebfonts.com/t/875fffdfa62169a0f131e90f37f1faf4.woff") format("woff"),
           url("https://db.onlinewebfonts.com/t/875fffdfa62169a0f131e90f37f1faf4.ttf") format("truetype");
    }

    :root {
      --bg-canvas: #fbfaf7;
      --card-bg: #ffffff;
      --deep: #181817;
      --white: #fffdfa;
      --ink: #181817;
      --muted: #77736a;
      --line: rgba(24, 24, 23, 0.10);
      --accent: #9567bf;
      --mint: #f2a8cf;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    /* Override theme.css body > header if present */
    body > header {
      background: transparent !important;
      color: var(--ink) !important;
    }

    body {
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      background-color: var(--theme-base, #fbfaf7);
      background-image: 
        radial-gradient(ellipse at 15% 15%, rgba(242, 168, 207, 0.22) 0%, transparent 40%),
        radial-gradient(ellipse at 85% 85%, rgba(149, 103, 191, 0.16) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 50%, rgba(254, 242, 241, 0.5) 0%, transparent 60%),
        url('medora-pastel-glow.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font: 14.5px/1.5 Karla, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3vh, 32px) 16px;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Back Home Floating Link */
    .top-nav {
      position: absolute;
      top: 20px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(24, 24, 23, 0.08);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .back-link:hover {
      color: var(--ink);
      background: #ffffff;
      border-color: rgba(24, 24, 23, 0.18);
    }
    .back-link svg { width: 14px; height: 14px; }

    /* Center Auth Wrapper */
    .auth-center-wrap {
      width: 100%;
      max-width: 410px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }

    /* Brand Logo */
    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 29px;
      font-weight: 720;
      color: var(--ink);
      margin-bottom: 20px;
      text-decoration: none;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      color: var(--deep);
      background: var(--mint);
      border-radius: 8px;
    }
    .brand-mark svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    /* Main Centered Card */
    .auth-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(24, 24, 23, 0.09);
      border-radius: 22px;
      padding: 30px 32px 28px;
      box-shadow: 
        0 20px 50px rgba(52, 44, 37, 0.06),
        0 2px 10px rgba(52, 44, 37, 0.02);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Segmented Mode Switcher */
    .mode-switch {
      display: flex;
      align-items: center;
      background: rgba(24, 24, 23, 0.05);
      padding: 3px;
      border-radius: 12px;
      width: 100%;
    }
    .mode-tab {
      flex: 1;
      text-align: center;
      padding: 7px 0;
      border: 0;
      background: transparent;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      transition: all 0.2s ease;
    }
    .mode-tab:hover {
      color: var(--ink);
    }
    .mode-tab.active {
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    /* Titles */
    .card-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-title {
      font-family: Karla, "Mazzard H", Inter, sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink);
    }
    .card-subtitle {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.45;
    }

    /* Social Buttons */
    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .social-btn {
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #ffffff;
      border: 1px solid rgba(24, 24, 23, 0.12);
      border-radius: 12px;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .social-btn:hover {
      border-color: rgba(24, 24, 23, 0.28);
      background: #fafaf8;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .social-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Divider */
    .divider {
      position: relative;
      text-align: center;
      margin: 2px 0;
    }
    .divider::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: rgba(24, 24, 23, 0.08);
    }
    .divider span {
      position: relative;
      background: #ffffff;
      padding: 0 10px;
      font-size: 11.5px;
      color: #9c958c;
      font-weight: 500;
    }

    /* Form Body */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .field-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .field-wrap.hidden {
      display: none;
    }
    .field-label {
      font-size: 11px;
      font-weight: 650;
      color: #575249;
    }
    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .forgot-link {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent);
    }
    .forgot-link:hover {
      text-decoration: underline;
    }

    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      color: #9c958c;
      pointer-events: none;
    }
    .text-input {
      width: 100%;
      height: 42px;
      padding: 0 38px 0 36px;
      background: #ffffff;
      border: 1px solid rgba(24, 24, 23, 0.13);
      border-radius: 11px;
      color: var(--ink);
      font-size: 13.5px;
      outline: none;
      transition: all 0.2s ease;
    }
    .text-input::placeholder {
      color: #a8a29a;
    }
    .text-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(149, 103, 191, 0.14);
    }
    .input-box:focus-within .input-icon {
      color: var(--accent);
    }

    .pwd-toggle {
      position: absolute;
      right: 10px;
      width: 26px;
      height: 26px;
      border: 0;
      background: transparent;
      color: #9c958c;
      display: grid;
      place-items: center;
      border-radius: 6px;
    }
    .pwd-toggle:hover {
      color: var(--ink);
    }
    .pwd-toggle svg {
      width: 15px;
      height: 15px;
    }

    /* Checkbox */
    .terms-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.4;
      cursor: pointer;
      margin-top: 2px;
    }
    .terms-row input[type="checkbox"] {
      width: 15px;
      height: 15px;
      margin-top: 1px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    .terms-row a {
      color: var(--ink);
      font-weight: 600;
      text-decoration: underline;
    }

    /* Submit CTA */
    .submit-btn {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: var(--deep);
      color: var(--white);
      font-size: 13.5px;
      font-weight: 650;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 4px;
      box-shadow: 0 4px 14px rgba(24, 24, 23, 0.14);
      transition: all 0.2s ease;
    }
    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(24, 24, 23, 0.20);
    }
    .submit-btn svg {
      width: 15px;
      height: 15px;
      transition: transform 0.2s ease;
    }
    .submit-btn:hover svg {
      transform: translateX(3px);
    }

    /* Footer Prompt */
    .card-footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    .switch-link {
      background: transparent;
      border: 0;
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
      margin-left: 3px;
    }
    .switch-link:hover {
      text-decoration: underline;
    }

    /* Sub-card security note */
    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
      font-size: 11.5px;
      color: var(--muted);
    }
    .security-badge svg {
      width: 13px;
      height: 13px;
      color: #608d4b;
    }

    /* Toast Notification */
    .toast-feedback {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      opacity: 0;
      background: var(--deep);
      color: var(--white);
      padding: 10px 20px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.20);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      pointer-events: none;
    }
    .toast-feedback.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast-feedback svg {
      width: 16px;
      height: 16px;
      color: #92e078;
    }

    @media (max-width: 480px) {
      .top-nav {
        position: static;
        margin-bottom: 16px;
        align-self: flex-start;
      }
      .auth-card {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Top back link -->
  <nav class="top-nav" aria-label="Navigare rapidă">
    <a href="index.html" class="back-link">
      <i data-lucide="arrow-left"></i>
      <span>Înapoi la Medora</span>
    </a>
  </nav>

  <!-- Centered Auth Container -->
  <main class="auth-center-wrap">
    
    <!-- Centered Brand -->
    <a href="index.html" class="auth-brand" aria-label="Medora, pagina principală">
      <span class="brand-mark"><img src="capsule-hero.png" alt="" aria-hidden="true"></span>
      medora
    </a>

    <!-- Auth Card -->
    <div class="auth-card">
      
      <!-- Segmented mode tabs -->
      <div class="mode-switch" role="tablist" aria-label="Selectează tipul autentificării">
        <button type="button" class="mode-tab active" id="tab-signup" role="tab" aria-selected="true">Înregistrare</button>
        <button type="button" class="mode-tab" id="tab-signin" role="tab" aria-selected="false">Autentificare</button>
      </div>

      <!-- Title & Subtitle -->
      <div class="card-header">
        <h1 class="card-title" id="form-title">Creează cont</h1>
        <p class="card-subtitle" id="form-desc">Salvează medicamente și monitorizează alertele oficiale.</p>
      </div>

      <!-- Social OAuth Grid -->
      <div class="social-grid">
        <button type="button" class="social-btn" id="btn-google" aria-label="Continuă cu Google">
          <svg class="social-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Google</span>
        </button>

        <button type="button" class="social-btn" id="btn-apple" aria-label="Continuă cu Apple">
          <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.99.6-2.63 1.35-.57.65-1.07 1.72-.94 2.74 1 .08 2.03-.49 2.65-1.24z"/>
          </svg>
          <span>Apple</span>
        </button>
      </div>

      <!-- Divider -->
      <div class="divider">
        <span>sau cu email</span>
      </div>

      <!-- Interactive Form -->
      <form id="auth-form" class="auth-form" novalidate autocomplete="on">
        
        <!-- Full Name (Sign Up only) -->
        <div class="field-wrap" id="group-name">
          <label class="field-label" for="user-name">Nume complet</label>
          <div class="input-box">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="user-name" name="name" class="text-input" placeholder="Dr. Andrei Popescu" autocomplete="name" required>
          </div>
        </div>

        <!-- Email -->
        <div class="field-wrap" id="group-email">
          <label class="field-label" for="user-email">Email profesional</label>
          <div class="input-box">
            <i data-lucide="mail" class="input-icon"></i>
            <input type="email" id="user-email" name="email" class="text-input" placeholder="medic@spital.ro" autocomplete="email" required>
          </div>
        </div>

        <!-- Password -->
        <div class="field-wrap" id="group-password">
          <div class="label-row">
            <label class="field-label" for="user-password">Parolă</label>
            <a href="#reset-password" class="forgot-link" id="forgot-link" style="display: none;">Ai uitat parola?</a>
          </div>
          <div class="input-box">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="user-password" name="password" class="text-input" placeholder="Minim 8 caractere" autocomplete="current-password" required>
            <button type="button" class="pwd-toggle" id="toggle-password" aria-label="Afișează/ascunde parola">
              <i data-lucide="eye" id="eye-icon"></i>
            </button>
          </div>
        </div>

        <!-- Terms agreement (Sign Up only) -->
        <label class="terms-row" id="group-terms">
          <input type="checkbox" id="terms-agree" required checked>
          <span>Sunt de acord cu <a href="#terms">Termenii</a> și <a href="#privacy">Confidențialitatea</a> Medora.</span>
        </label>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" id="submit-btn">
          <span id="submit-label">Creează cont gratuit</span>
          <i data-lucide="arrow-right"></i>
        </button>

      </form>

      <!-- Switch mode prompt -->
      <div class="card-footer">
        <span id="footer-text">Ai deja un cont?</span>
        <button type="button" class="switch-link" id="switch-mode-btn">Conectează-te</button>
      </div>

    </div>

    <!-- Security reassurance note -->
    <div class="security-badge">
      <i data-lucide="shield-check"></i>
      <span>Date sincronizate oficial cu ANMDMR & EMA</span>
    </div>

  </main>

  <!-- Demo Toast Feedback -->
  <div class="toast-feedback" id="toast-feedback" role="status" aria-live="polite">
    <i data-lucide="check-circle-2"></i>
    <span id="toast-message">Autentificare reușită!</span>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        lucide.createIcons();
      }

      const tabSignUp = document.getElementById('tab-signup');
      const tabSignIn = document.getElementById('tab-signin');
      const switchModeBtn = document.getElementById('switch-mode-btn');
      
      const formTitle = document.getElementById('form-title');
      const formDesc = document.getElementById('form-desc');
      const groupName = document.getElementById('group-name');
      const nameInput = document.getElementById('user-name');

      function calcInitials(name) {
        if (!name || !name.trim()) return 'AP';
        const cleaned = name.replace(/^dr\.\s*/i, '').trim();
        const parts = cleaned.split(/\s+/).filter(Boolean);
        if (parts.length >= 2) {
          return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }
        return cleaned.slice(0, 2).toUpperCase() || 'AP';
      }
      const groupTerms = document.getElementById('group-terms');
      const forgotLink = document.getElementById('forgot-link');
      const submitLabel = document.getElementById('submit-label');
      const footerText = document.getElementById('footer-text');
      
      const authForm = document.getElementById('auth-form');
      const togglePwdBtn = document.getElementById('toggle-password');
      const pwdInput = document.getElementById('user-password');
      const toast = document.getElementById('toast-feedback');
      const toastMsg = document.getElementById('toast-message');

      let currentMode = 'signup';

      function setMode(mode) {
        currentMode = mode;
        if (mode === 'signup') {
          tabSignUp.classList.add('active');
          tabSignUp.setAttribute('aria-selected', 'true');
          tabSignIn.classList.remove('active');
          tabSignIn.setAttribute('aria-selected', 'false');

          formTitle.textContent = 'Creează cont';
          formDesc.textContent = 'Salvează medicamente și monitorizează alertele oficiale.';
          groupName.classList.remove('hidden');
          
          document.getElementById('user-name').setAttribute('required', '');
          groupTerms.style.display = 'flex';
          forgotLink.style.display = 'none';
          submitLabel.textContent = 'Creează cont gratuit';
          footerText.textContent = 'Ai deja un cont?';
          switchModeBtn.textContent = 'Conectează-te';
        } else {
          tabSignIn.classList.add('active');
          tabSignIn.setAttribute('aria-selected', 'true');
          tabSignUp.classList.remove('active');
          tabSignUp.setAttribute('aria-selected', 'false');

          formTitle.textContent = 'Bine ai revenit';
          formDesc.textContent = 'Accesează catalogul, alertele și istoricul deciziilor.';
          groupName.classList.add('hidden');
          
          document.getElementById('user-name').removeAttribute('required');
          groupTerms.style.display = 'none';
          forgotLink.style.display = 'inline';
          submitLabel.textContent = 'Conectează-te';
          footerText.textContent = 'Nu ai un cont?';
          switchModeBtn.textContent = 'Înregistrează-te gratuit';
        }
      }

      tabSignUp.addEventListener('click', () => setMode('signup'));
      tabSignIn.addEventListener('click', () => setMode('signin'));
      switchModeBtn.addEventListener('click', () => {
        setMode(currentMode === 'signup' ? 'signin' : 'signup');
      });

      // Password visibility toggle
      togglePwdBtn.addEventListener('click', () => {
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        if (window.lucide) {
          togglePwdBtn.innerHTML = isPwd 
            ? '<i data-lucide="eye-off"></i>' 
            : '<i data-lucide="eye"></i>';
          lucide.createIcons();
        }
      });

      // Toast feedback
      function showToast(msg) {
        toastMsg.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 3000);
      }

      // Form submission simulation
      authForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('user-email').value;
        if (!email) return;

        const nameVal = nameInput ? nameInput.value.trim() : '';
        const userInitials = calcInitials(nameVal);
        const finalName = nameVal || (currentMode === 'signup' ? 'Dr. Andrei Popescu' : (email.split('@')[0]));

        const userInitials = window.getDoctorInitials ? window.getDoctorInitials(finalName) : calcInitials(finalName);
        const userGradient = window.getDoctorGradient ? window.getDoctorGradient(finalName) : 'radial-gradient(circle at 32% 28%, #bbf7d0 0%, #38bdf8 36%, #818cf8 68%, #4f46e5 100%)';

        const userObj = {
          name: finalName,
          email: email,
          fallback: userInitials,
          gradient: userGradient,
          role: 'Medicină de familie · Activ',
          registeredAt: new Date().toISOString()
        };
        try {
          localStorage.setItem('medora_user', JSON.stringify(userObj));
        } catch(err) {}

        if (currentMode === 'signup') {
          showToast(`Cont creat pentru ${finalName}! Avatar HeroUI atribuit.`);
        } else {
          showToast(`Bine ai revenit, ${finalName}! Redirecționare...`);
        }
        setTimeout(() => {
          window.location.href = 'medora.html#overview';
        }, 1400);
      });

      // Social auth buttons simulation
      document.getElementById('btn-google').addEventListener('click', () => {
        showToast('Conectare securizată cu Google...');
        setTimeout(() => {
          window.location.href = 'medora.html#overview';
        }, 1400);
      });

      document.getElementById('btn-apple').addEventListener('click', () => {
        showToast('Conectare securizată cu Apple...');
        setTimeout(() => {
          window.location.href = 'medora.html#overview';
        }, 1400);
      });
    });
  </script>
</body>
</html>
