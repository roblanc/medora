      first = a.name || "";
      second = b.name || "";
    } else if (sortDescriptor.column === "status") {
      first = a.status || "";
      second = b.status || "";
    } else if (sortDescriptor.column === "form") {
      first = (a.form || "") + " " + (a.atc || "");

      first = getScore(a);
      second = getScore(b);
      return sortDescriptor.direction === "descending" ? second - first : first - second;
    } else {
      first = a[sortDescriptor.column] || "";
      second = b[sortDescriptor.column] || "";
    }

    if (typeof first === "number" && typeof second === "number") {
      return sortDescriptor.direction === "descending" ? second - first : first - second;

    let cmp = String(first).localeCompare(String(second), "ro", { sensitivity: "base" });

function tableRows(list, alreadySorted = false) {
  if (!list || !list.length) {
    return `<tr class="catalog-row-empty"><td colspan="6"><div class="empty" style="padding: 36px 20px; text-align: center; color: var(--muted);">Niciun medicament găsit în nomenclator. Verifică ortografia sau caută după substanță activă (ex: „amoxicilină”, „paracetamol”).</div></td></tr>`;
  }

  const sorted = alreadySorted ? list : sortDrugList(list);

  return sorted.map(d => {
    const isSelected = selected.includes(d.id);
    const isFollowed = followed.includes(d.id);

    let stockPercent = 80;
    let stockLabel = "Stabil";
    let progressClass = "progress-default";
    if (d.status === "resumed") {
      stockPercent = 95;
      stockLabel = "Disponibil";
      progressClass = "progress-success";
    } else if (d.status === "temporary") {
      stockPercent = 30;
      stockLabel = "Deficit";
      progressClass = "progress-warning";
    } else if (d.status === "permanent") {
      stockPercent = 5;
      stockLabel = "Epuizat";
      progressClass = "progress-danger";
    }

    return `
    <tr class="catalog-row ${isSelected ? "is-selected" : ""}" data-row-id="${d.id}">
      <td class="td-select col-select">
        <label class="ui-checkbox-wrap" title="Compară ${d.name}">
          <input type="checkbox" class="ui-checkbox tick" data-select="${d.id}" ${isSelected ? "checked" : ""} aria-label="Compară ${d.name}">
        </label>
      </td>
      <td class="td-drug col-drug">
        <div class="cell-drug-group">
          <div class="drug-avatar ${d.status === "permanent" ? "avatar-danger" : d.status === "temporary" ? "avatar-warning" : d.status === "resumed" ? "avatar-success" : "avatar-default"}">
            <img src="spot-icons/drug-pill.png" alt="" aria-hidden="true">
          </div>
          <div class="drug-info-text">
            <button class="plain table-drug-title drug-title" data-detail="${d.id}">${d.name} ${d.strength}</button>
            <span class="table-drug-sub drug-dci">${d.dci}</span>
          </div>
        </div>
      </td>
      <td class="td-status col-status">
        ${badge(d)}
      </td>
      <td class="td-meta col-meta">
        <div class="cell-meta-group">
          <p class="table-meta-title meta-form">${d.form}</p>
          <p class="table-meta-sub meta-atc"><span class="table-atc-pill">ATC: ${d.atc}</span></p>
        </div>
      </td>
      <td class="td-progress col-progress">
        <div class="table-progress-container" title="Disponibilitate estimată: ${stockPercent}%">
          <div class="table-progress-track">
            <div class="table-progress-bar ${progressClass}" style="width: ${stockPercent}%;"></div>
          </div>
          <span class="table-progress-text">${stockLabel}</span>
        </div>
      </td>
      <td class="td-actions col-action">
        <div class="cell-actions-group">
          <button class="btn-table-action ${isFollowed ? "followed" : ""}" data-follow="${d.id}" aria-pressed="${isFollowed}" title="${isFollowed ? "Nu mai urmări" : "Urmărește medicamentul"}">
            <i class="ph ${isFollowed ? "ph-check" : "ph-plus"}"></i>
            <span>${isFollowed ? "Urmărit" : "Urmărește"}</span>
          </button>
          <button class="btn-table-more" data-detail="${d.id}" title="Vezi fișa completă">
            <i class="ph ph-dots-three-vertical"></i>
          </button>
        </div>
      </td>
    </tr>
    `;
  }).join("");
}

let catalogPage = 1;
const catalogPageSize = 3;

function renderCatalogView() {
  const rowsEl = $("#catalog-rows");
  if (!rowsEl) return;
  
  const sorted = sortDrugList(lastCatalogList || []);
  const total = sorted.length;
  const totalPages = Math.max(1, Math.ceil(total / catalogPageSize));
  
  if (catalogPage > totalPages) catalogPage = totalPages;
  if (catalogPage < 1) catalogPage = 1;
  
  const start = (catalogPage - 1) * catalogPageSize;
  const end = Math.min(start + catalogPageSize, total);
  const pagedList = sorted.slice(start, end);
  
  rowsEl.innerHTML = tableRows(pagedList, true);
  
  if ($("#table-count-badge")) {
    $("#table-count-badge").textContent = (query.trim().length >= 2) ? `${total} rezultate` : `${total} produse`;
  }
  if ($("#table-footer-count")) {
    $("#table-footer-count").textContent = total > 0
      ? `Afișare ${start + 1}–${end} din ${total} produse active`
      : "0 produse găsite";
  }
  
  renderHeroUIPagination(totalPages, catalogPage);
  renderCompareBar();
  bindRows();
}

function renderHeroUIPagination(totalPages, activePage) {
  const container = $("#catalog-pagination-content");
  if (!container) return;
  
  let linksHtml = "";
  for (let p = 1; p <= totalPages; p++) {
    linksHtml += `
      <li class="heroui-pagination-item">
        <button class="heroui-pagination-link ${p === activePage ? "is-active" : ""}" data-page="${p}" aria-current="${p === activePage ? "page" : "false"}">
          ${p}
        </button>
      </li>
    `;
  }

  container.innerHTML = `
    <li class="heroui-pagination-item">
      <button class="heroui-pagination-prev" id="heroui-pagination-prev" ${activePage <= 1 ? "disabled" : ""} aria-label="Previous page">
        <i class="ph ph-caret-left heroui-pagination-prev-icon" aria-hidden="true"></i>
        <span>Previous</span>
      </button>
    </li>
    ${linksHtml}
    <li class="heroui-pagination-item">
      <button class="heroui-pagination-next" id="heroui-pagination-next" ${activePage >= totalPages ? "disabled" : ""} aria-label="Next page">
        <span>Next</span>
        <i class="ph ph-caret-right heroui-pagination-next-icon" aria-hidden="true"></i>
      </button>
    </li>
  `;

  const prevBtn = $("#heroui-pagination-prev");
  if (prevBtn) {
    prevBtn.onclick = () => {
      if (catalogPage > 1) {
        catalogPage--;
        renderCatalogView();
      }
    };
  }

  const nextBtn = $("#heroui-pagination-next");
  if (nextBtn) {
    nextBtn.onclick = () => {
      if (catalogPage < totalPages) {
        catalogPage++;
        renderCatalogView();
      }
    };
  }

  container.querySelectorAll(".heroui-pagination-link").forEach(btn => {
    btn.onclick = () => {
      const p = parseInt(btn.dataset.page, 10);
      if (p && p !== catalogPage) {
        catalogPage = p;
        renderCatalogView();
      }
    };
  });
}

let currentSearchController = null;
async function updateCatalog() {
  const trimmed = query.trim();
  const rowsEl = $("#catalog-rows");
  catalogPage = 1;
  
  // If query is short (< 2 chars), show demo/curated list
  if (trimmed.length < 2) {
    let list = drugs.filter(d => normal([d.name, d.dci, d.atc, d.group || ""].join(" ")).includes(normal(trimmed)));
    lastCatalogList = list;
    renderCatalogView();
    return;
  }

  // Show loading indicator
  if (rowsEl) {
    rowsEl.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 40px 20px; color: #667085;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13.5px;">
        <span class="provenance-dot" style="animation: pulse 1s infinite;"></span>
        <span>Se caută „<strong>${trimmed}</strong>” în baza națională ANMDMR (Alex's API)...</span>
      </div>
    </td></tr>`;
  }

  // Abort previous in-flight search
  if (currentSearchController) {
    currentSearchController.abort();
  }
  currentSearchController = new AbortController();

  try {
    const apiUrl = `/api/v1/medicines?country=RO&q=${encodeURIComponent(trimmed)}&limit=30`;
    const res = await fetch(apiUrl, { signal: currentSearchController.signal });
    if (!res.ok) throw new Error("API HTTP " + res.status);
    const data = await res.json();
    
    if (data && Array.isArray(data.items) && data.items.length > 0) {
      const liveList = data.items.map(item => {
        const dciStr = (Array.isArray(item.active_substances) && item.active_substances.length > 0)
          ? item.active_substances.join(" + ")
          : "Substanță nespecificată";
        
        const mapped = {
          id: item.medicine_id,
          name: item.name || "Medicament fără denumire",
          dci: dciStr,
          strength: item.strength || "",
          form: item.pharmaceutical_form || item.dose_form || "Formă nespecificată",
          atc: item.atc_code || "-",
          status: item.supply_shortage ? "temporary" : (item.availability === "authorised" ? "resumed" : "unknown"),
          date: "Date live ANMDMR",
          note: item.marketing_authorisation_holder ? `Deținător autorizație (MAH): ${item.marketing_authorisation_holder}` : "Produs autorizat în România.",
          event: item.supply_shortage ? "Deficit raportat" : null,
          group: "Nomenclator Oficial",
          mah: item.marketing_authorisation_holder || "",
          isLive: true
        };
        liveDrugsCache.set(mapped.id, mapped);
        return mapped;
      });

      lastCatalogList = liveList;
      renderCatalogView();
      return;
    }
  } catch (err) {
    if (err.name === "AbortError") return;
    console.warn("API live query error, falling back to local dataset:", err);
  }

  // Fallback to local filter if API returned 0 items or was unreachable
  let list = drugs.filter(d => normal([d.name, d.dci, d.atc, d.group || ""].join(" ")).includes(normal(trimmed)));
  lastCatalogList = list;
  if (list.length === 0 && rowsEl) {
    rowsEl.innerHTML = `<tr class="catalog-row-empty"><td colspan="6"><div class="empty" style="padding: 36px 20px; text-align: center; color: var(--muted);">Niciun medicament găsit pentru „<strong>${trimmed}</strong>” în nomenclatorul oficial. Verifică ortografia sau încearcă după substanță activă (ex: „amoxicilină”, „paracetamol”, „metformină”).</div></td></tr>`;
    if ($("#table-count-badge")) $("#table-count-badge").textContent = "0 produse";
    if ($("#table-footer-count")) $("#table-footer-count").textContent = "0 produse active";
    renderHeroUIPagination(1, 1);
    renderCompareBar();
    return;
  }
  renderCatalogView();
}

window.checkPresetInteractions = function(id1, id2) {
  const d1 = get(id1), d2 = get(id2);
  const sel1 = document.getElementById('int-drug1');
  const sel2 = document.getElementById('int-drug2');
  if (sel1) sel1.value = id1;
  if (sel2) sel2.value = id2;
  const res = document.getElementById('int-standalone-result');
  if (!res) return;
  if (id1 === id2 || d1.dci === d2.dci) {
    res.innerHTML = `<div style="padding: 12px; background: #fae9e1; border-radius: 10px; border: 1px solid #f2c7b8;">
      <strong style="color: #b76650; font-size: 14px;">⚠️ Alertă critică: Dedublare terapeutică</strong>
      <p style="margin: 6px 0 0; color: #853724; font-size: 12px;">Ambele produse conțin aceeași substanță activă (<strong>${d1.dci}</strong>). Administrarea concomitentă duce la supradozaj.</p>
    </div>`;
  } else if (d1.atc && d2.atc && d1.atc.substring(0,3) === d2.atc.substring(0,3)) {
    res.innerHTML = `<div style="padding: 12px; background: #faf0da; border-radius: 10px; border: 1px solid #f0dcab;">
      <strong style="color: #956f29; font-size: 14px;">⚡ Atenționare: Aceeași clasă farmacologică</strong>
      <p style="margin: 6px 0 0; color: #6d501b; font-size: 12px;">Asociere de molecule din aceeași clasă terapeutică (ATC ${d1.atc.substring(0,3)}). Verificați justificarea dublei terapii.</p>
    </div>`;
  } else {
    res.innerHTML = `<div style="padding: 12px; background: #edf5e8; border-radius: 10px; border: 1px solid #d5e5cd;">
      <strong style="color: #2b5f3a; font-size: 14px;">✅ Fără incompatibilități majore raportate</strong>
      <p style="margin: 6px 0 0; color: #345c3f; font-size: 12px;">Asocierea dintre <strong>${d1.name}</strong> (${d1.dci}) și <strong>${d2.name}</strong> (${d2.dci}) este utilizată curent în practica clinică. Consultați SmPC 4.5 pentru detalii fine.</p>
    </div>`;
  }
};

ss="btn-source btn-source-primary" href="research.html" target="_blank"><span>Citește researchul și prioritățile</span><span class="btn-source-arrow">${icon('arrow')}</span></a></div></div>`}
function navigate(next){
  const valid = ['overview','home','catalog','interactions','availability','radar','tools','atc','icd10','watch','sources'];
  if(!valid.includes(next)) next = 'overview';
  if(next === 'home') next = 'overview';
  if(next === 'radar') next = 'availability';
  page = next;
  filter = 'all';
  location.hash = next;
  render();
  window.scrollTo(0,0);
}
function follow(id){if(followed.includes(id)){followed=followed.filter(x=>x!==id);toast('Medicament eliminat din lista mea')}else{followed.push(id);toast('Medicament adăugat în lista mea')}save('medora-followed',followed);render()}
function openModal(title,kicker,body){$('#modal-title').textContent=title;$('#modal-kicker').textContent=kicker;$('#modal-body').innerHTML=body;if(!$('#modal').open)$('#modal').showModal()}
async function detail(id){
  let d = get(id);
  // Try to enrich live details if id starts with M
  if (id.startsWith('M') && !d.enriched) {
    try {
      fetch(`/api/v1/medicines/${encodeURIComponent(id)}`)
        .then(r => r.json())
        .then(full => {
          if (full && full.medicine_id) {
            d.enriched = true;
            if (full.marketing_authorisation_holder) d.mah = full.marketing_authorisation_holder;
            const mahEl = document.getElementById('modal-mah-val');
            if (mahEl) mahEl.textContent = d.mah || 'Autorizat ANMDMR';
          }
        }).catch(()=>{});
    } catch(e){}
  }openModal(d.name+' '+d.strength,'FIȘĂ DEMO · PRODUS FICTIV',`<div class="rowtitle">${badge(d)}</div><p>Prezentare fictivă pentru testarea interfeței. Nu reprezintă un produs autorizat și nu conține recomandări medicale.</p><div class="details"><div><small>Substanță activă</small>${d.dci}</div><div><small>Concentrație</small>${d.strength}</div><div><small>Formă</small>${d.form}</div><div><small>Cod ATC ilustrativ</small>${d.atc}</div><div><small>Deținător autorizație (MAH)</small><span id="modal-mah-val">${d.mah || (d.id.startsWith('M') ? 'Se încarcă...' : 'DEMO-' + d.id.toUpperCase())}</span></div><div><small>Stoc în farmacii</small>Necunoscut</div></div><div class="clinical-grid"><div class="clinical-card" style="cursor:pointer" id="detail-subst-card"><img src="spot-icons/substitution.png" alt="" aria-hidden="true"><div><div class="clinical-card-kicker">ALTERNATIVE DCI</div><div class="clinical-card-title">Prezentări cu ${d.dci}</div></div></div><div class="clinical-card" style="cursor:pointer" id="detail-presc-card"><img src="spot-icons/prescription.png" alt="" aria-hidden="true"><div><div class="clinical-card-kicker">GHID PRESCRIERE</div><div class="clinical-card-title">Posologie & RCP: ${d.form}</div></div></div></div><h3>Istoricul disponibilității</h3>${d.event?`<div class="timeline"><div><small>09 sept. 2026 · Scenariu demonstrativ</small>Notificare introdusă în radar</div><div><small>${d.date} · Dată fictivă</small>${d.event}</div></div><p>${d.note}</p>`:'<p>Nu avem evenimente pentru acest produs demo. Lipsa unei alerte nu confirmă disponibilitatea.</p>'}<div class="modalfoot"><button id="detail-follow" class="btn primary">${icon(followed.includes(id)?'check':'plus')}${followed.includes(id)?'Nu mai urmări':'Urmărește medicamentul'}</button><button id="same-dci" class="btn">Compară prezentări ${icon('arrow')}</button><a class="btn" href="${sourceUrls.nomen}" target="_blank" rel="noopener">Deschide nomenclatorul ↗</a></div>`);$('#detail-follow').onclick=()=>{follow(id);detail(id)};$('#same-dci').onclick=()=>{$('#modal').close();query=d.dci;selected=[id];navigate('catalog')};if($('#detail-subst-card'))$('#detail-subst-card').onclick=()=>{$('#modal').close();query=d.dci;navigate('catalog')};if($('#detail-presc-card'))$('#detail-presc-card').onclick=()=>toast(`RCP și ghid oficial pentru ${d.name} (${d.form}) deschis.`);}
function settings(){openModal('Alerte care contează pentru tine','PREFERINȚE · SALVARE LOCALĂ',`<p>Alege tipurile de evenimente pentru lista ta. În acest prototip, notificările se pot doar previzualiza.</p><form id="prefs-form"><label class="checkline"><input class="tick" name="temporary" type="checkbox" ${prefs.temporary?'checked':''}>Discontinuități temporare</label><label class="checkline"><input class="tick" name="permanent" type="checkbox" ${prefs.permanent?'checked':''}>Discontinuități permanente</label><label class="checkline"><input class="tick" name="resumed" type="checkbox" ${prefs.resumed?'checked':''}>Reluări de comercializare</label><label class="field">Frecvență dorită în produsul final<select name="frequency"><option value="daily" ${prefs.frequency==='daily'?'selected':''}>Rezumat zilnic</option><option value="immediate" ${prefs.frequency==='immediate'?'selected':''}>La fiecare schimbare</option><option value="weekly" ${prefs.frequency==='weekly'?'selected':''}>Rezumat săptămânal</option></select></label><button class="btn primary" type="submit">Salvează și previzualizează ${icon('arrow')}</button></form>`);$('#prefs-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);prefs={frequency:f.get('frequency'),temporary:f.has('temporary'),permanent:f.has('permanent'),resumed:f.has('resumed')};save('medora-prefs',prefs);let list=drugs.filter(d=>followed.includes(d.id)&&prefs[d.status]);openModal('Preferințe salvate','PREVIZUALIZARE · NU SE TRIMITE',`<p>Ritm selectat: ${({daily:'zilnic',weekly:'săptămânal',immediate:'la fiecare schimbare'})[prefs.frequency]}. ${list.length} evenimente demo corespund listei și preferințelor tale.</p><div class="panel">${alertrows(list)}</div><p style="margin-top:18px">Trimiterea emailurilor și notificărilor push necesită implementarea serviciului.</p>`);bindRows()};}
function compare(){if(selected.length!==2)return;const a=get(selected[0]),b=get(selected[1]);const isSameDci=a.dci===b.dci;const isSameStrength=a.strength===b.strength;const isSameForm=a.form===b.form;openModal('Comparație de prezentări','DATE DEMO · FĂRĂ ECHIVALENȚĂ CLINICĂ',`<p>Aceeași substanță, concentrație și formă nu garantează interschimbabilitatea. Exemplu de comparație administrativă.</p><div class="tablewrap"><table><thead><tr><th>Câmp</th><th>${a.name}</th><th>${b.name}</th></tr></thead><tbody>${[['DCI',a.dci,b.dci],['Concentrație',a.strength,b.strength],['Formă',a.form,b.form],['ATC',a.atc,b.atc],['Statut',badge(a),badge(b)],['Stoc local','Necunoscut','Necunoscut']].map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="clinical-compare-box"><img src="${isSameDci?'spot-icons/substitution.png':'spot-icons/interactions.png'}" alt="" aria-hidden="true"><div><div class="clinical-card-kicker">${isSameDci?'ANALIZĂ SUBSTITUȚIE BIOECHIVALENȚĂ':'VERIFICARE ASOCIERE & INTERACȚIUNI'}</div><div class="clinical-card-title">${isSameDci?(isSameStrength&&isSameForm?`Potențial de substituție generică directă: ambele conțin ${a.dci} ${a.strength}.`:`Aceeași substanță activă (${a.dci}), dar formele sau concentrațiile diferă.`):`Asociere terapeutică între ${a.dci} și ${b.dci}.`}</div><small style="display:block;margin-top:4px;color:var(--theme-muted,#75817a);line-height:1.4">${isSameDci?'Înainte de eliberare, consultați lista oficială a medicamentelor generice interschimbabile aprobată de ANMDMR.':'Nu au fost semnalate contraindicații majore de asociere în ghidul demonstrativ curent.'}</small></div></div><div class="result" style="margin-top:14px">${isSameDci&&isSameStrength&&isSameForm?'DCI, concentrație și formă coincid în setul demo.':'Prezentările diferă. Nu sunt marcate drept echivalente.'}</div>`)}

document.querySelectorAll(".th-sortable").forEach(th => {

      sortDescriptor.column = col;
      sortDescriptor.direction = "ascending";

    document.querySelectorAll(".th-sortable").forEach(header => {
      const iconEl = header.querySelector(".sort-icon");
      if (iconEl) {
        if (header.dataset.sort === sortDescriptor.column) {
          iconEl.className = "ph " + (sortDescriptor.direction === "ascending" ? "ph-arrow-up" : "ph-arrow-down") + " sort-icon";
        } else {
          iconEl.className = "ph ph-arrows-down-up sort-icon";

function initUserProfile() {
  try {
    const raw = localStorage.getItem('medora_user');
    const user = raw ? JSON.parse(raw) : null;
    const nameEl = document.getElementById('user-profile-name');
    const roleEl = document.getElementById('user-profile-role');
    const avatarEl = document.getElementById('user-avatar-widget');
    const fallbackEl = document.getElementById('user-avatar-fallback');
    
    const defaultGradient = 'radial-gradient(circle at 32% 28%, #bbf7d0 0%, #38bdf8 36%, #818cf8 68%, #4f46e5 100%)';
    const initials = user?.fallback || (window.getDoctorInitials ? window.getDoctorInitials(user?.name) : 'AP');
    const gradient = user?.gradient || (window.getDoctorGradient ? window.getDoctorGradient(user?.name) : defaultGradient);

    if (nameEl) nameEl.textContent = user?.name || 'Dr. Andrei Popescu';
    if (roleEl) roleEl.textContent = user?.role || 'Medicină de familie · Activ';
    if (window.renderMedoraAvatar && avatarEl) {
      window.renderMedoraAvatar(avatarEl, user?.name || user?.email, user?.avatar_url);
    } else {
      if (fallbackEl) fallbackEl.textContent = initials;
      if (avatarEl) avatarEl.style.background = gradient;
    }
    
    const widget = document.getElementById('user-profile-widget');
    if (widget) {
      widget.onclick = () => {
        const currName = user?.name || 'Dr. Andrei Popescu';
        const currRole = user?.role || 'Medicină de familie · Activ';
        const currEmail = user?.email || 'andrei.popescu@spital.ro';
        openModal(currName, 'PROFIL ACTIV MEDORA', `
          <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:16px;background:var(--theme-wash-1);border-radius:18px;">
            <div class="heroui-avatar heroui-avatar-preview" style="background: ${gradient};">
              <span class="heroui-avatar-fallback">${initials}</span>
            </div>
            <div>
              <strong style="font-size:16px;color:var(--theme-deep);">${currName}</strong>
              <div style="font-size:12px;color:var(--theme-muted);">${currRole}</div>
              <div style="font-size:11px;color:var(--theme-muted);margin-top:2px;">${currEmail}</div>
            </div>
          </div>
          <p>Contul tău are acces complet la nomenclatorul ANMDMR, alertele de farmacovigilență și istoricul deciziilor clinice.</p>
          <div class="modalfoot" style="margin-top:24px;">
            <a class="btn primary" href="auth.html" style="text-decoration:none;">Schimbă contul</a>
            <button class="btn" id="logout-btn">Deconectare</button>
          </div>
        `);
        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
          logoutBtn.onclick = () => {
            localStorage.removeItem('medora_user');
            location.reload();
          };
        }
      };
    }
  } catch(e) {}
}
