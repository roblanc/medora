<style>
:root{--ink:#181817;--muted:#77736a;--line:#ddd6c8;--paper:#f6f0e4;--green:#0e8176;--lime:#a7b77c;--red:#c95866;--orange:#c59a22;--white:#fffdfa;--pink:#f2a8cf;--yellow:#f2d35e;--blue:#b9cff0;--navy:#17154a}

.hero:after{border-color:#ffffff24;box-shadow:0 0 0 30px #ffffff0d,0 0 0 65px #ffffff0a}

.searchhint{color:#c9c4bc}.searchhint button{color:var(--pink)}

.pulsecard p{color:#3f472f}.pulsecard .eyebrow{color:#333a28}

.radar-art:after{border-color:var(--lime);background:var(--pink)}
.stat:nth-child(1) .stat-icon{background:var(--lime);color:var(--ink)}
.stat:nth-child(2) .stat-icon{background:var(--yellow);color:var(--ink)}
.stat:nth-child(3) .stat-icon{background:var(--blue);color:var(--ink)}
.chip.active{background:var(--ink);border-color:var(--ink);color:var(--white)}
.alertrow,.watchrow{border-color:#e8e0d4}

.comparebar{background:#dfe8c6}
th{background:#f5efe5}.result{background:#dce7f7}.details{background:#f3ecdf}
.notice{background:#fbefb5;color:#675109!important}

.toast{background:var(--ink);color:var(--white)}

<script>
const phosphor={spark:'asterisk',grid:'squares-four',pill:'pill',radar:'broadcast',bookmark:'bookmark-simple',sliders:'sliders-horizontal',shield:'shield-check',book:'book-open',home:'house',bell:'bell',search:'magnifying-glass',arrow:'arrow-right',plus:'plus',x:'x',clock:'clock',alert:'warning',check:'check',link:'link-simple',download:'download-simple'};
const icon=n=>`<i class="ph ph-${phosphor[n]||phosphor.pill}" aria-hidden="true"></i>`;
function icons(){document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon))}icons();
const drugs=[
{id:'amoxi',name:'Amoxi Demo',dci:'Amoxicilină',strength:'500 mg',form:'Capsule',atc:'J01CA04',status:'temporary',date:'01 oct. 2026',note:'Întrerupere temporară anunțată. Dată estimată de revenire: 15 noiembrie.',event:'Discontinuitate temporară',group:'Antibiotice'},
{id:'metfo',name:'Metfo Demo',dci:'Metformină',strength:'850 mg',form:'Comprimate filmate',atc:'A10BA02',status:'permanent',date:'01 dec. 2026',note:'Încetare permanentă a comercializării pentru această prezentare.',event:'Discontinuitate permanentă',group:'Diabet'},
{id:'levo',name:'Levo Demo',dci:'Levotiroxină',strength:'50 μg',form:'Comprimate',atc:'H03AA01',status:'resumed',date:'10 sept. 2026',note:'Reluare a comercializării anunțată. Stocul local rămâne necunoscut.',event:'Comercializare reluată',group:'Endocrinologie'},
{id:'amoxi2',name:'Amoxi B Demo',dci:'Amoxicilină',strength:'500 mg',form:'Capsule',atc:'J01CA04',status:'unknown',group:'Antibiotice'},
{id:'metfo2',name:'Metfo B Demo',dci:'Metformină',strength:'850 mg',form:'Comprimate filmate',atc:'A10BA02',status:'unknown',group:'Diabet'},
{id:'rami',name:'Rami Demo',dci:'Ramipril',strength:'5 mg',form:'Comprimate',atc:'C09AA05',status:'unknown',group:'Cardiologie'},
{id:'atorva',name:'Atorva Demo',dci:'Atorvastatină',strength:'20 mg',form:'Comprimate filmate',atc:'C10AA05',status:'unknown',group:'Cardiologie'},

function readStore(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
let followed=readStore('medora-followed',['amoxi','metfo','rami']);if(!Array.isArray(followed))followed=[];followed=followed.filter(id=>drugs.some(d=>d.id===id));let prefs=readStore('medora-prefs',{frequency:'daily',temporary:true,permanent:true,resumed:true});let selected=[];let page='overview',filter='all',query=new URLSearchParams(location.search).get('q')||'';let toastTimer;
const $=s=>document.querySelector(s);const get=id=>drugs.find(d=>d.id===id);const normal=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function save(key,v){try{localStorage.setItem(key,JSON.stringify(v))}catch{toast('Stocare locală indisponibilă în acest browser.')}}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3000)}
const badge=d=>`<span class="pill ${d.status==='permanent'?'red':d.status==='resumed'?'green':''}">${({temporary:'Temporară · demo',permanent:'Permanentă · demo',resumed:'Reluată · demo',unknown:'Statut necunoscut'})[d.status]}</span>`;
const footer=()=>`<footer class="footer"><span>Medora · Concept independent pentru profesioniști</span><span>Produse și evenimente fictive. Fără utilizare clinică. &nbsp; <a href="#sources">Despre date ↗</a></span></footer>`;
const head=(title,sub,button='')=>`<div class="heading"><div><div class="eyebrow">SPAȚIUL TĂU CLINIC / ROMÂNIA</div><h1>${title}</h1><p class="sub">${sub}</p></div>${button}</div>`;
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#navcount').textContent=followed.length;$('#crumb').textContent=({overview:'Privire de ansamblu',catalog:'Medicamente',radar:'Radar alerte',watch:'Lista mea',tools:'Instrumente',sources:'Surse & transparență'})[page];$('#content').innerHTML=({overview:overview,catalog:catalog,radar:radar,watch:watch,tools:tools,sources:sources})[page]()+footer();bind();}
function alertrows(list){return list.length?list.map(d=>`<article class="alertrow"><i class="statusdot ${d.status==='permanent'?'red':d.status==='resumed'?'green':''}"></i><div class="alerttext"><div class="rowtitle"><button class="plain" data-detail="${d.id}">${d.name} ${d.strength}</button><span class="mini">SCENARIU FICTIV</span></div><p>${d.note}</p><div class="alertmeta">${badge(d)}<span>${d.date}</span></div></div><button class="rowwatch ${followed.includes(d.id)?'on':''}" data-follow="${d.id}" aria-label="${followed.includes(d.id)?'Nu mai urmări':'Urmărește'} ${d.name}" aria-pressed="${followed.includes(d.id)}">${icon(followed.includes(d.id)?'bookmark':'plus')}</button></article>`).join(''):'<div class="empty">Nicio alertă pentru acest filtru.</div>'}
function watchrows(){return followed.length?followed.slice(0,4).map(id=>{let d=get(id);return `<div class="watchrow"><div class="drugicon"><img src="spot-icons/drug-pill.png" alt="" aria-hidden="true"></div><div class="info"><button class="plain" data-detail="${id}">${d.name} ${d.strength}</button><small>${d.dci} · ${d.event?'Alertă demo':'Statut necunoscut'}</small></div><button class="rowwatch arrow" data-detail="${id}" aria-label="Detalii ${d.name}">${icon('arrow')}</button></div>`}).join(''):'<div class="empty">Urmărește primul medicament din catalog.</div>'}
function chips(){return [['all','Toate'],['temporary','Temporare'],['permanent','Permanente'],['resumed','Reluate']].map(([id,l])=>`<button class="chip ${filter===id?'active':''}" data-filter="${id}" aria-pressed="${filter===id}">${l}</button>`).join('')}
function overview(){return head('Situația de azi','Medicamente urmărite, schimbări de disponibilitate și sursele care le confirmă.',`<button class="btn" data-settings>${icon('sliders')}Preferințe alerte</button>`)+`<div class="provenance-rail" aria-label="Starea surselor de date"><div><span class="provenance-dot"></span><strong>Surse monitorizate</strong></div><span>ANMDMR</span><span>EMA</span><span>CNAS</span><time datetime="2026-09-12T08:40:00+03:00">Verificare demo · 08:40</time></div><div class="hero-grid"><section class="hero"><img class="hero-spot" src="spot-icons/medicine.png" alt="" aria-hidden="true"><div class="hero-copy"><div class="eyebrow">CĂUTARE ÎN NOMENCLATOARE</div><h2>Găsește prezentarea exactă.</h2><form id="hero-search" class="searchbox">${icon('search')}<input name="q" aria-label="Caută medicamente" placeholder="Denumire, substanță activă sau cod ATC" autocomplete="off"><span class="key">↵</span></form><div class="searchhint">Exemple: <button data-search="amoxicilina">amoxicilină</button> &nbsp;·&nbsp; <button data-search="metformina">metformină</button> &nbsp;·&nbsp; cod ATC</div></div></section><section class="pulsecard"><img class="pulse-spot" src="spot-icons/radar.png" alt="" aria-hidden="true"><div class="pulse-copy"><div class="eyebrow">${icon('radar')} RADAR DISPONIBILITATE</div><h2>3 schimbări necesită verificare.</h2><p>Două întreruperi și o revenire sunt active în scenariile urmărite.</p><button class="btn primary small" data-go="radar">Deschide jurnalul ${icon('arrow')}</button></div></section></div><div class="stats" aria-label="Rezumat operațional"><div class="stat"><img class="stat-spot" src="spot-icons/watchlist.png" alt="" aria-hidden="true"><div><strong>${followed.length}</strong><div class="metriclabel">Sub observație</div><small>prezentări urmărite</small></div></div><div class="stat"><img class="stat-spot" src="spot-icons/compare.png" alt="" aria-hidden="true"><div><strong>${drugs.filter(d=>d.status==='temporary'||d.status==='permanent').length}</strong><div class="metriclabel">Întreruperi active</div><small>temporare sau permanente</small></div></div><div class="stat"><img class="stat-spot" src="spot-icons/sources.png" alt="" aria-hidden="true"><div><strong>1</strong><div class="metriclabel">Revenire anunțată</div><small>în așteptarea confirmării</small></div></div></div><div class="lower-grid"><section><div class="section-head"><h2>Jurnal de schimbări</h2><button class="linkbutton" data-go="radar">Vezi jurnalul complet ${icon('arrow')}</button></div><div class="panel"><div class="filters">${chips()}</div><div id="alerts">${alertrows(drugs.filter(d=>d.event&&(filter==='all'||d.status===filter)))}</div></div></section><section><div class="section-head"><h2>Lista de urmărire</h2><button class="linkbutton" data-go="watch">Gestionează lista ${icon('arrow')}</button></div><div class="panel">${watchrows()}<button class="addwatch" data-go="catalog">Adaugă un medicament</button></div><div class="source-note">${icon('shield')}<span>Fiecare schimbare trebuie legată de documentul original, data publicării și istoricul verificărilor. Datele curente sunt fictive.</span></div></section></div>`}
function catalog(){return head('Medicamente','Caută, urmărește și compară prezentări. Catalog demonstrativ cu 8 produse.')+`<div class="searchbox catalog-search">${icon('search')}<input id="catalog-query" aria-label="Caută în catalog" placeholder="Denumire, DCI, ATC sau specialitate"></div><div class="panel tablewrap catalog-tablewrap"><table class="catalog-table"><thead><tr><th>Compară</th><th>Medicament / DCI</th><th>Formă / cod ATC</th><th>Disponibilitate</th><th>Urmărire</th></tr></thead><tbody id="catalog-rows"></tbody></table></div><div id="compare-bar-wrap"></div><p class="source-note">Numele comerciale și statusurile sunt fictive. Aceeași DCI nu garantează substituția clinică.</p>`}
function tableRows(list){return list.length?list.map(d=>`<tr class="catalog-row ${selected.includes(d.id)?'is-selected':''}"><td class="col-select"><label class="compare-opt" title="Compară ${d.name}"><input class="tick" type="checkbox" data-select="${d.id}" aria-label="Compară ${d.name}" ${selected.includes(d.id)?'checked':''}><span class="compare-label">Compară</span></label></td><td class="col-drug"><button class="plain drug-title" data-detail="${d.id}">${d.name} ${d.strength}</button><small class="drug-dci">${d.dci}</small></td><td class="col-meta"><span class="meta-form">${d.form}</span><span class="meta-separator">·</span><small class="meta-atc">ATC: ${d.atc}</small></td><td class="col-status">${badge(d)}</td><td class="col-action"><button class="btn small btn-follow ${followed.includes(d.id)?'followed':''}" data-follow="${d.id}" aria-pressed="${followed.includes(d.id)}">${icon(followed.includes(d.id)?'check':'plus')}<span>${followed.includes(d.id)?'Urmărit':'Urmărește'}</span></button></td></tr>`).join(''):'<tr class="catalog-row-empty"><td colspan="5"><div class="empty">Niciun rezultat în catalogul demo. Încearcă „amoxi” sau „metformină”.</div></td></tr>'}
function renderCompareBar(){
  const el=$('#compare-bar-wrap');
  if(!el)return;
  if(selected.length===0){
    el.innerHTML=`<div class="comparebar comparebar-empty"><div class="compare-icon-wrap">${icon('sliders')}</div><div class="compare-text-wrap"><strong>Compară două medicamente</strong><p>Bifează „Compară” pe 2 produse din catalog pentru a deschide analiza comparativă (DCI, concentrație, disponibilitate, cod ATC).</p></div></div>`;
  }else if(selected.length===1){
    const d1=get(selected[0]);
    el.innerHTML=`<div class="comparebar comparebar-step1"><div class="compare-top"><span class="compare-badge">1 din 2 selectate</span><button class="compare-clear-btn" id="compare-clear">${icon('x')} Anulează</button></div><div class="compare-chips"><span class="compare-chip selected">${d1.name} ${d1.strength}</span><span class="compare-chip placeholder">+ Alege încă un medicament</span></div><p class="compare-subtext">Mai bifează încă un produs din listă pentru a activa comparația față în față.</p></div>`;
    $('#compare-clear').onclick=()=>{selected=[];updateCatalog()};
  }else if(selected.length===2){
    const d1=get(selected[0]),d2=get(selected[1]);
    el.innerHTML=`<div class="comparebar comparebar-ready"><div class="compare-top"><span class="compare-badge ready">${icon('check')} 2 din 2 pregătite</span><button class="compare-clear-btn" id="compare-clear">${icon('x')} Resetează</button></div><div class="compare-chips"><span class="compare-chip selected">${d1.name}</span><span class="compare-vs">vs</span><span class="compare-chip selected">${d2.name}</span></div><button class="btn primary compare-cta" id="compare">${icon('sliders')} Compară cele două prezentări →</button></div>`;
    $('#compare').onclick=compare;
    $('#compare-clear').onclick=()=>{selected=[];updateCatalog()};
  }
}
function updateCatalog(){let list=drugs.filter(d=>normal([d.name,d.dci,d.atc,d.group].join(' ')).includes(normal(query)));$('#catalog-rows').innerHTML=tableRows(list);renderCompareBar();bindRows()}
function radar(){return head('Radar de disponibilitate','De la notificare la acțiune: ce se schimbă, când și pentru ce prezentare.',`<button class="btn primary" data-settings>${icon('bell')}Configurează alertele</button>`)+`<p class="notice">Toate cele 3 evenimente sunt fictive. O discontinuitate notificată nu dovedește absența din fiecare farmacie.</p><div class="panel fullradar"><div class="filters">${chips()}<label style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:10px"><input id="only-followed" type="checkbox" class="tick">Doar lista mea</label></div><div id="alerts">${alertrows(drugs.filter(d=>d.event&&(filter==='all'||d.status===filter)))}</div></div><div class="source-note">${icon('link')}<a href="${sourceUrls.dis}" target="_blank" rel="noopener">Vezi sursa reală: notificări de discontinuitate ANMDMR ↗</a></div>`}
function watch(){return head('Lista mea','Medicamentele importante pentru practica ta. Preferințele se păstrează în acest browser.',`<button class="btn" data-go="catalog">${icon('plus')}Adaugă medicament</button>`)+`<div class="panel">${followed.length?followed.map(id=>{let d=get(id);return `<div class="watchrow"><div class="drugicon"><img src="spot-icons/drug-pill.png" alt="" aria-hidden="true"></div><div class="info"><button class="plain" data-detail="${id}">${d.name} ${d.strength}</button><small>${d.dci} · ${d.form}</small></div>${badge(d)}<button class="iconbtn" data-follow="${id}" aria-label="Elimină ${d.name} din lista mea">${icon('x')}</button></div>`}).join(''):'<div class="empty">Lista este goală. Adaugă medicamente din catalog.</div>'}</div><div class="comparebar"><span>Alerte pentru produsele pe care le urmărești.</span><button class="btn" data-settings>Preferințe ${icon('arrow')}</button></div>`}
function tools(){return head('Instrumente clinice','Calculatoare matematice și utilitare de verificare clinică. Fără recomandări terapeutice directe.')+`<div class="toolsgrid"><section class="panel toolcard"><div class="toolcard-top"><span class="toolcard-badge">CALCUL MATEMATIC · ADULȚI</span><div class="toolcard-icon"><img src="spot-icons/tools.png" alt="" aria-hidden="true"></div></div><div class="toolcard-body"><h2>Indice de masă corporală</h2><p class="sub">Calcul ponderal IMC = greutate (kg) / înălțime² (m²). Util pentru ajustarea preliminară a dozelor.</p><form id="bmi-form"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px"><label class="field" style="margin:0">Greutate (kg)<input type="number" name="weight" min="1" max="500" step="0.1" value="70" required></label><label class="field" style="margin:0">Înălțime (cm)<input type="number" name="height" min="50" max="250" step="0.1" value="175" required></label></div><button class="btn primary" type="submit" style="width:100%;justify-content:center">Calculează IMC ${icon('arrow')}</button></form><div class="result" id="bmi-result" aria-live="polite" style="margin-top:14px">Introdu valorile pentru calcul. Rezultatul nu include interpretare clinică.</div></div></section><section class="panel toolcard"><div class="toolcard-top"><span class="toolcard-badge">SIGURANȚĂ CLINICĂ · DEMO</span><div class="toolcard-icon"><img src="spot-icons/interactions.png" alt="" aria-hidden="true"></div></div><div class="toolcard-body"><h2>Verificator compatibilitate & interacțiuni</h2><p class="sub">Simulează analiza combinată între două substanțe active sau clase din catalogul curent.</p><form id="interactions-form"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px"><label class="field" style="margin:0">Medicament A<select name="drug1">${drugs.map(d=>`<option value="${d.id}">${d.name} (${d.dci})</option>`).join('')}</select></label><label class="field" style="margin:0">Medicament B<select name="drug2">${[...drugs].reverse().map(d=>`<option value="${d.id}">${d.name} (${d.dci})</option>`).join('')}</select></label></div><button class="btn primary" type="submit" style="width:100%;justify-content:center">Verifică asocierea ${icon('arrow')}</button></form><div class="result" id="interactions-result" aria-live="polite" style="margin-top:14px">Alege două produse pentru a simula analiza de interacțiune.</div></div></section><section class="panel toolcard"><div class="toolcard-top"><span class="toolcard-badge">ECHIVALENȚĂ TERAPEUTICĂ</span><div class="toolcard-icon"><img src="spot-icons/substitution.png" alt="" aria-hidden="true"></div></div><div class="toolcard-body"><h2>Finder substituție generică</h2><p class="sub">Găsește rapid alternative cu aceeași DCI și formă în caz de notificare de discontinuitate.</p><div style="display:flex;flex-direction:column;gap:9px;margin-top:4px"><button class="btn small" style="justify-content:space-between;padding:10px 14px" data-subst="Amoxicilină"><span>Alternative <strong>Amoxicilină</strong> 500 mg</span>${icon('arrow')}</button><button class="btn small" style="justify-content:space-between;padding:10px 14px" data-subst="Metformină"><span>Alternative <strong>Metformină</strong> 850 mg</span>${icon('arrow')}</button><button class="btn small" style="justify-content:space-between;padding:10px 14px" data-subst="Ramipril"><span>Alternative <strong>Ramipril</strong> 5 mg</span>${icon('arrow')}</button></div><p class="source-note" style="margin-top:14px">Substituția farmaceutică presupune validarea bioechivalenței conform ANMDMR.</p></div></section><section class="panel toolcard"><div class="toolcard-top"><span class="toolcard-badge">GHID DE PRESCRIERE</span><div class="toolcard-icon"><img src="spot-icons/prescription.png" alt="" aria-hidden="true"></div></div><div class="toolcard-body"><h2>Reguli de prescriere & posologie</h2><p class="sub">Informații orientative de administrare, ajustare doze și acces la documentele oficiale RCP.</p><div style="display:flex;flex-direction:column;gap:9px;margin-top:4px"><button class="btn small" style="justify-content:space-between;padding:10px 14px" data-presc="adulti"><span>Ghid adulți: antibioterapie de primă linie</span>${icon('arrow')}</button><button class="btn small" style="justify-content:space-between;padding:10px 14px" data-presc="varstnici"><span>Ajustare doze la pacienți vârstnici / eGFR</span>${icon('arrow')}</button></div><a class="btn-source" href="${sourceUrls.nomen}" target="_blank" rel="noopener" style="margin-top:14px;width:100%"><span>Consultă Nomenclatorul Oficial</span><span class="btn-source-arrow">${icon('arrow')}</span></a></div></section></div>`}
function sources(){const list=[['NOMENCLATOR','ANMDMR · Identitatea medicamentului','Denumire, DCI, formă, cod CIM, APP și documente oficiale. Autorizarea nu confirmă stocul.',sourceUrls.nomen,'spot-icons/source-nomen.png'],['DISPONIBILITATE','ANMDMR · Discontinuități','Notificări de întrerupere temporară sau permanentă. Fundament pentru alerte personalizate.',sourceUrls.dis,'spot-icons/source-radar.png'],['SIGURANȚĂ','ANMDMR · Comunicări directe','Informații adresate profesioniștilor. Flux distinct de discontinuitățile comerciale.',sourceUrls.dhpc,'spot-icons/source-safety.png'],['EXTINDERE EUROPEANĂ','EMA · Cataloage de discontinuități','Cataloage publice și registre naționale. Fără promisiunea unui inventar european complet.',sourceUrls.ema,'spot-icons/source-europe.png']];return head('O sursă clară. Pentru fiecare informație.','Sursele candidate pentru produsul final. Nicio conexiune live în acest prototip.')+`<div class="sourcesgrid">${list.map(([e,h,p,url,img])=>`<section class="panel sourcecard"><div class="sourcecard-top"><span class="sourcecard-badge">${e}</span><div class="sourcecard-icon"><img src="${img}" alt="" aria-hidden="true"></div></div><div class="sourcecard-body"><h3>${h}</h3><p>${p}</p></div><div class="sourcecard-footer"><a class="btn-source" href="${url}" target="_blank" rel="noopener"><span>Deschide sursa</span><span class="btn-source-arrow">${icon('arrow')}</span></a></div></section>`).join('')}</div><div class="panel sourcecard sourcecard-mock"><div class="sourcecard-top"><span class="sourcecard-badge">PROTOTIP & METODOLOGIE</span><div class="sourcecard-icon"><img src="spot-icons/source-research.png" alt="" aria-hidden="true"></div></div><div class="sourcecard-body"><h3>Ce funcționează în acest mock</h3><p>Căutare locală, filtre, listă urmărită persistentă, fișe, comparație, calculator IMC și preferințe salvate. Notificările sunt previzualizări locale; nu se trimit emailuri sau notificări push.</p></div><div class="sourcecard-footer"><a class="btn-source btn-source-primary" href="research.html" target="_blank"><span>Citește researchul și prioritățile</span><span class="btn-source-arrow">${icon('arrow')}</span></a></div></div>`}
function navigate(next){if(!['overview','catalog','radar','watch','tools','sources'].includes(next))next='overview';page=next;filter='all';location.hash=next;render();window.scrollTo(0,0)}
function follow(id){if(followed.includes(id)){followed=followed.filter(x=>x!==id);toast('Medicament eliminat din lista mea')}else{followed.push(id);toast('Medicament adăugat în lista mea')}save('medora-followed',followed);render()}
function openModal(title,kicker,body){$('#modal-title').textContent=title;$('#modal-kicker').textContent=kicker;$('#modal-body').innerHTML=body;if(!$('#modal').open)$('#modal').showModal()}
function detail(id){let d=get(id);openModal(d.name+' '+d.strength,'FIȘĂ DEMO · PRODUS FICTIV',`<div class="rowtitle">${badge(d)}</div><p>Prezentare fictivă pentru testarea interfeței. Nu reprezintă un produs autorizat și nu conține recomandări medicale.</p><div class="details"><div><small>Substanță activă</small>${d.dci}</div><div><small>Concentrație</small>${d.strength}</div><div><small>Formă</small>${d.form}</div><div><small>Cod ATC ilustrativ</small>${d.atc}</div><div><small>Identificator local</small>DEMO-${d.id.toUpperCase()}</div><div><small>Stoc în farmacii</small>Necunoscut</div></div><div class="clinical-grid"><div class="clinical-card" style="cursor:pointer" id="detail-subst-card"><img src="spot-icons/substitution.png" alt="" aria-hidden="true"><div><div class="clinical-card-kicker">ALTERNATIVE DCI</div><div class="clinical-card-title">Prezentări cu ${d.dci}</div></div></div><div class="clinical-card" style="cursor:pointer" id="detail-presc-card"><img src="spot-icons/prescription.png" alt="" aria-hidden="true"><div><div class="clinical-card-kicker">GHID PRESCRIERE</div><div class="clinical-card-title">Posologie & RCP: ${d.form}</div></div></div></div><h3>Istoricul disponibilității</h3>${d.event?`<div class="timeline"><div><small>09 sept. 2026 · Scenariu demonstrativ</small>Notificare introdusă în radar</div><div><small>${d.date} · Dată fictivă</small>${d.event}</div></div><p>${d.note}</p>`:'<p>Nu avem evenimente pentru acest produs demo. Lipsa unei alerte nu confirmă disponibilitatea.</p>'}<div class="modalfoot"><button id="detail-follow" class="btn primary">${icon(followed.includes(id)?'check':'plus')}${followed.includes(id)?'Nu mai urmări':'Urmărește medicamentul'}</button><button id="same-dci" class="btn">Compară prezentări ${icon('arrow')}</button><a class="btn" href="${sourceUrls.nomen}" target="_blank" rel="noopener">Deschide nomenclatorul ↗</a></div>`);$('#detail-follow').onclick=()=>{follow(id);detail(id)};$('#same-dci').onclick=()=>{$('#modal').close();query=d.dci;selected=[id];navigate('catalog')};if($('#detail-subst-card'))$('#detail-subst-card').onclick=()=>{$('#modal').close();query=d.dci;navigate('catalog')};if($('#detail-presc-card'))$('#detail-presc-card').onclick=()=>toast(`RCP și ghid oficial pentru ${d.name} (${d.form}) deschis.`);}
function settings(){openModal('Alerte care contează pentru tine','PREFERINȚE · SALVARE LOCALĂ',`<p>Alege tipurile de evenimente pentru lista ta. În acest prototip, notificările se pot doar previzualiza.</p><form id="prefs-form"><label class="checkline"><input class="tick" name="temporary" type="checkbox" ${prefs.temporary?'checked':''}>Discontinuități temporare</label><label class="checkline"><input class="tick" name="permanent" type="checkbox" ${prefs.permanent?'checked':''}>Discontinuități permanente</label><label class="checkline"><input class="tick" name="resumed" type="checkbox" ${prefs.resumed?'checked':''}>Reluări de comercializare</label><label class="field">Frecvență dorită în produsul final<select name="frequency"><option value="daily" ${prefs.frequency==='daily'?'selected':''}>Rezumat zilnic</option><option value="immediate" ${prefs.frequency==='immediate'?'selected':''}>La fiecare schimbare</option><option value="weekly" ${prefs.frequency==='weekly'?'selected':''}>Rezumat săptămânal</option></select></label><button class="btn primary" type="submit">Salvează și previzualizează ${icon('arrow')}</button></form>`);$('#prefs-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);prefs={frequency:f.get('frequency'),temporary:f.has('temporary'),permanent:f.has('permanent'),resumed:f.has('resumed')};save('medora-prefs',prefs);let list=drugs.filter(d=>followed.includes(d.id)&&prefs[d.status]);openModal('Preferințe salvate','PREVIZUALIZARE · NU SE TRIMITE',`<p>Ritm selectat: ${({daily:'zilnic',weekly:'săptămânal',immediate:'la fiecare schimbare'})[prefs.frequency]}. ${list.length} evenimente demo corespund listei și preferințelor tale.</p><div class="panel">${alertrows(list)}</div><p style="margin-top:18px">Trimiterea emailurilor și notificărilor push necesită implementarea serviciului.</p>`);bindRows()};}
function compare(){if(selected.length!==2)return;const a=get(selected[0]),b=get(selected[1]);const isSameDci=a.dci===b.dci;const isSameStrength=a.strength===b.strength;const isSameForm=a.form===b.form;openModal('Comparație de prezentări','DATE DEMO · FĂRĂ ECHIVALENȚĂ CLINICĂ',`<p>Aceeași substanță, concentrație și formă nu garantează interschimbabilitatea. Exemplu de comparație administrativă.</p><div class="tablewrap"><table><thead><tr><th>Câmp</th><th>${a.name}</th><th>${b.name}</th></tr></thead><tbody>${[['DCI',a.dci,b.dci],['Concentrație',a.strength,b.strength],['Formă',a.form,b.form],['ATC',a.atc,b.atc],['Statut',badge(a),badge(b)],['Stoc local','Necunoscut','Necunoscut']].map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="clinical-compare-box"><img src="${isSameDci?'spot-icons/substitution.png':'spot-icons/interactions.png'}" alt="" aria-hidden="true"><div><div class="clinical-card-kicker">${isSameDci?'ANALIZĂ SUBSTITUȚIE BIOECHIVALENȚĂ':'VERIFICARE ASOCIERE & INTERACȚIUNI'}</div><div class="clinical-card-title">${isSameDci?(isSameStrength&&isSameForm?`Potențial de substituție generică directă: ambele conțin ${a.dci} ${a.strength}.`:`Aceeași substanță activă (${a.dci}), dar formele sau concentrațiile diferă.`):`Asociere terapeutică între ${a.dci} și ${b.dci}.`}</div><small style="display:block;margin-top:4px;color:var(--theme-muted,#75817a);line-height:1.4">${isSameDci?'Înainte de eliberare, consultați lista oficială a medicamentelor generice interschimbabile aprobată de ANMDMR.':'Nu au fost semnalate contraindicații majore de asociere în ghidul demonstrativ curent.'}</small></div></div><div class="result" style="margin-top:14px">${isSameDci&&isSameStrength&&isSameForm?'DCI, concentrație și formă coincid în setul demo.':'Prezentările diferă. Nu sunt marcate drept echivalente.'}</div>`)}
function bindRows(){document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=()=>follow(b.dataset.follow));document.querySelectorAll('[data-select]').forEach(b=>b.onchange=()=>{let id=b.dataset.select;if(b.checked&&selected.length===2){b.checked=false;toast('Poți compara două prezentări simultan.');return}selected=b.checked?[...selected,id]:selected.filter(x=>x!==id);updateCatalog()})}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{query='';navigate(b.dataset.go)});document.querySelectorAll('[data-settings]').forEach(b=>b.onclick=settings);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(c=>{c.classList.toggle('active',c.dataset.filter===filter);c.setAttribute('aria-pressed',c.dataset.filter===filter)});filterAlerts()});bindRows();if($('#hero-search'))$('#hero-search').onsubmit=e=>{e.preventDefault();query=new FormData(e.target).get('q').trim();navigate('catalog')};document.querySelectorAll('[data-search]').forEach(b=>b.onclick=()=>{query=b.dataset.search;navigate('catalog')});if($('#catalog-query')){$('#catalog-query').value=query;$('#catalog-query').oninput=e=>{query=e.target.value;updateCatalog()};updateCatalog()}if($('#only-followed'))$('#only-followed').onchange=filterAlerts;if($('#bmi-form'))$('#bmi-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),w=Number(f.get('weight')),h=Number(f.get('height'));if(!Number.isFinite(w)||!Number.isFinite(h)||w<=0||h<=0)return;let r=w/((h/100)**2);$('#bmi-result').innerHTML=`<strong>${r.toLocaleString('ro-RO',{maximumFractionDigits:1})}</strong> kg/m²<br><span class="sub">${w} kg / (${h/100} m)² · rezultat matematic, fără interpretare clinică.</span>`};if($('#interactions-form'))$('#interactions-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),id1=f.get('drug1'),id2=f.get('drug2'),d1=get(id1),d2=get(id2),res=$('#interactions-result');if(id1===id2){res.innerHTML=`<strong style="color:#d9534f">Atenție:</strong> Ai selectat același medicament (<strong>${d1.name}</strong>). Risc de supradozaj prin dublare.`}else if(d1.dci===d2.dci){res.innerHTML=`<strong style="color:#e67e22">Substanță identică:</strong> Ambele conțin <strong>${d1.dci}</strong>. Atenție la cumularea dozelor zilnice maxime.`}else{res.innerHTML=`<strong style="color:#2b5f3a">Fără interacțiuni majore semnalate (demo):</strong> Asocierea dintre <strong>${d1.dci}</strong> și <strong>${d2.dci}</strong> este comună în practica clinică. Consultați RCP complet.`}};document.querySelectorAll('[data-subst]').forEach(b=>{b.onclick=()=>{query=b.dataset.subst;navigate('catalog')}});document.querySelectorAll('[data-presc]').forEach(b=>{b.onclick=()=>{const mode=b.dataset.presc;openModal(mode==='adulti'?'Ghid de prescriere: Antibioterapie primă linie':'Ajustare doze: Pacienți vârstnici / eGFR','GHID CLINIC ORIENTATIV',`<p>${mode==='adulti'?'Recomandări pentru prescrierea rațională a aminopenicilinelor și evaluarea antecedentelor alergice.':'Ajustarea posologiei pentru medicamente cu eliminare preponderent renală în funcție de clearance-ul creatininei.'}</p><div class="clinical-compare-box"><img src="spot-icons/prescription.png" alt="" aria-hidden="true"><div><div class="clinical-card-kicker">PROTOCOL TERAPEUTIC</div><div class="clinical-card-title">Prescriere responsabilă și monitorizare periodică</div><small style="display:block;margin-top:4px;color:var(--theme-muted,#75817a)">Date pur orientative. Prescrierea finală aparține exclusiv medicului curant pe baza istoricului pacientului.</small></div></div>`)}});}
function filterAlerts(){const only=$('#only-followed')?.checked;$('#alerts').innerHTML=alertrows(drugs.filter(d=>d.event&&(filter==='all'||d.status===filter)&&(!only||followed.includes(d.id))));bindRows()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{query='';navigate(b.dataset.page)});$('#notifications').onclick=settings;$('#close-modal').onclick=()=>$('#modal').close();$('#modal').onclick=e=>{if(e.target===$('#modal')){let r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close()}};$('#research-nav').onclick=()=>window.open('research.html','_blank');window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(p!==page)navigate(p)});page=['overview','catalog','radar','watch','tools','sources'].includes(location.hash.slice(1))?location.hash.slice(1):'overview';render();const initialDrug=new URLSearchParams(location.search).get('drug');if(initialDrug&&get(initialDrug))detail(initialDrug);

function initUserProfile() {
  try {
    const raw = localStorage.getItem('medora_user');
    const user = raw ? JSON.parse(raw) : null;
    const nameEl = document.getElementById('user-profile-name');
    const roleEl = document.getElementById('user-profile-role');
    const avatarEl = document.getElementById('user-avatar-widget');
    const fallbackEl = document.getElementById('user-avatar-fallback');
    
    const defaultGradient = 'radial-gradient(circle at 32% 28%, #bbf7d0 0%, #38bdf8 36%, #818cf8 68%, #4f46e5 100%)';
    const initials = user?.fallback || (window.getDoctorInitials ? window.getDoctorInitials(user?.name) : 'AP');
    const gradient = user?.gradient || (window.getDoctorGradient ? window.getDoctorGradient(user?.name) : defaultGradient);

    if (nameEl) nameEl.textContent = user?.name || 'Dr. Andrei Popescu';
    if (roleEl) roleEl.textContent = user?.role || 'Medicină de familie · Activ';
    if (window.renderMedoraAvatar && avatarEl) {
      window.renderMedoraAvatar(avatarEl, user?.email || user?.name);
    } else {
      if (fallbackEl) fallbackEl.textContent = initials;
      if (avatarEl) avatarEl.style.background = gradient;
    }
    
    const widget = document.getElementById('user-profile-widget');
    if (widget) {
      widget.onclick = () => {
        const currName = user?.name || 'Dr. Andrei Popescu';
        const currRole = user?.role || 'Medicină de familie · Activ';
        const currEmail = user?.email || 'andrei.popescu@spital.ro';
        openModal(currName, 'PROFIL ACTIV MEDORA', `
          <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:16px;background:var(--theme-wash-1);border-radius:18px;">
            <div class="heroui-avatar heroui-avatar-preview" style="background: ${gradient};">
              <span class="heroui-avatar-fallback">${initials}</span>
            </div>
            <div>
              <strong style="font-size:16px;color:var(--theme-deep);">${currName}</strong>
              <div style="font-size:12px;color:var(--theme-muted);">${currRole}</div>
              <div style="font-size:11px;color:var(--theme-muted);margin-top:2px;">${currEmail}</div>
            </div>
          </div>
          <p>Contul tău are acces complet la nomenclatorul ANMDMR, alertele de farmacovigilență și istoricul deciziilor clinice.</p>
          <div class="modalfoot" style="margin-top:24px;">
            <a class="btn primary" href="auth.html" style="text-decoration:none;">Schimbă contul</a>
            <button class="btn" id="logout-btn">Deconectare</button>
          </div>
        `);
        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
          logoutBtn.onclick = () => {
            localStorage.removeItem('medora_user');
            location.reload();
          };
        }
      };
    }
  } catch(e) {}
}
initUserProfile();

</script></body></html>
